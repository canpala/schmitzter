<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Hitster DIY</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <div id="loading" class="state">
      <p>Lade Karte …</p>
    </div>

    <div id="error" class="state hidden">
      <h1>Ups!</h1>
      <p id="errorText">Diese Karte konnte nicht gefunden werden.</p>
    </div>

    <div id="game" class="state hidden">
      <button id="playBtn" class="big-button">▶ Abspielen</button>

      <div id="playerWrap" class="player-wrap hidden">
        <div id="player"></div>
        <div class="player-cover" aria-hidden="true"></div>
      </div>

      <button id="revealBtn" class="big-button hidden">🔍 Aufdecken</button>

      <div id="result" class="result hidden">
        <div class="result-year" id="resultYear"></div>
        <div class="result-title" id="resultTitle"></div>
        <div class="result-artist" id="resultArtist"></div>
      </div>
    </div>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
